name: Build Boards

on:
  push:
    branches:
      - main
      - ci/* # for ci test
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare:
    name: Determine variants to build
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.select.outputs.variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - id: list
        name: Get all variant list
        run: |
          python scripts/build.py --list-boards --json > "$RUNNER_TEMP/all-variants.json"

      - id: select
        name: Select variants based on changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Keep the raw variant matrix out of environment variables:
          # it exceeds GitHub Actions per-variable size limit.
          ALL_VARIANTS=$(jq -c '[.[] | {board, name}]' "$RUNNER_TEMP/all-variants.json")

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              BASE_SHA="$BEFORE_SHA"
              HEAD_SHA="HEAD"
            else
              BASE_SHA=""
              HEAD_SHA=""
            fi
          else
            BASE_SHA=""
            HEAD_SHA=""
          fi

          if [[ -n "$BASE_SHA" ]]; then
            CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
          else
            # No usable baseline: treat every file as changed.
            CHANGED=$(git ls-files)
          fi
          echo -e "Changed files:\n$CHANGED"

          if [[ -z "$CHANGED" ]] || ! grep -q '^main/' <<< "$CHANGED"; then
            echo "variants=[]" >> $GITHUB_OUTPUT
          else
            echo "variants=$ALL_VARIANTS" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: ${{ needs.prepare.outputs.variants != '[]' }}
    strategy:
      fail-fast: false  # 单个变体失败不影响其它变体
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.variants) }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build current variant
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/release.py ${{ matrix.board }} --name ${{ matrix.name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_${{ matrix.name }}_${{ github.sha }}.bin
          path: build/merged-binary.bin
          if-no-files-found: error
